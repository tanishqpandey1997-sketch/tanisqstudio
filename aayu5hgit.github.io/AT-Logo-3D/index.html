<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Logo mark</title>
<style>
    html,
    body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
    }

    #app {
        position: fixed;
        inset: 0;
    }
</style>
<div id="app"></div>

<script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" }}
</script>

<script type="module">
    import * as THREE from 'three'; import { SVGLoader } from 'three/addons/loaders/SVGLoader.js'; import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'; const SVG = `<svg viewBox="0 0 498 502" xmlns="http://www.w3.org/2000/svg"><path d="M477.788 0.000107405L20.0789 0.0249176C9.0385 0.0255161 0.086897 8.97197 0.079946 20.0123L0.000147581 146.758C-0.00680941 157.808 8.94849 166.77 19.9984 166.771L134.112 166.78C148.793 166.782 158.454 182.065 152.042 195.272C117.364 266.693 79.9459 337.959 45.4625 409.312C35.6241 429.669 23.7723 452.005 13.0732 473.554C6.63163 486.528 16.1881 501.393 30.6732 501.394L150.15 501.401C157.747 501.402 164.689 497.098 168.062 490.29C188.871 448.298 209.806 405.759 231.007 363.8C238.375 349.218 259.144 349.276 266.514 363.857L330.413 490.275C333.76 496.897 340.487 501.127 347.907 501.218C384.009 501.658 428.874 501.51 466.81 501.439C481.327 501.412 491.011 486.427 485.061 473.187L360.026 194.967C354.078 181.732 363.761 166.766 378.271 166.768L477.809 166.782C488.857 166.784 497.814 157.827 497.812 146.779L497.789 19.9965C497.787 8.9518 488.833 -0.000491275 477.788 0.000107405Z" fill="black"/></svg>`;
    const CX=248.9, CY=250.7; const app=document.getElementById('app'); const renderer=new THREE.WebGLRenderer({antialias:true, alpha:true, premultipliedAlpha:false}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
    renderer.setClearColor(0x000000,0); renderer.shadowMap.enabled=false; // no shadows renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05; app.appendChild(renderer.domElement); const scene=new THREE.Scene(); // no background
    → transparent const pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(new RoomEnvironment(),0.03).texture; const camera=new THREE.PerspectiveCamera(33, innerWidth/innerHeight, 1, 4000); camera.position.set(0,0,1150); // pulled
    back so the mark stays fully in frame through the whole spin (with margin) const key=new THREE.DirectionalLight(0xffffff,2.1); key.position.set(-160,220,340); scene.add(key); const rim=new THREE.DirectionalLight(0xffffff,1.4); rim.position.set(260,-120,-160);
    scene.add(rim); const fill=new THREE.DirectionalLight(0xffffff,0.9); fill.position.set(120,60,260); scene.add(fill); scene.add(new THREE.AmbientLight(0xffffff,0.35)); // lift so no face reads near-black const parsed=new SVGLoader().parse(SVG); let
    shape=null, best=-1; for(const p of parsed.paths){ for(const s of SVGLoader.createShapes(p)){ const b=new THREE.Box3(); s.getPoints(20).forEach(q=>b.expandByPoint(new THREE.Vector3(q.x,q.y,0))); const sz=b.getSize(new THREE.Vector3()), a=sz.x*sz.y;
    if(a>best){best=a; shape=s;} }} const group=new THREE.Group(); group.scale.y=-1; scene.add(group); const depth=42, bevel=Math.min(9,depth*0.28); const geo=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:true,bevelThickness:bevel,bevelSize:bevel,bevelSegments:5,curveSegments:64});
    geo.translate(-CX,-CY,-depth/2); geo.computeVertexNormals(); const mat=new THREE.MeshPhysicalMaterial({ color:new THREE.Color('#E0E0E0'), metalness:0.25, roughness:0.32, clearcoat:0.7, clearcoatRoughness:0.18, envMapIntensity:0.7, side:THREE.DoubleSide,
    }); group.add(new THREE.Mesh(geo,mat)); addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); }); /* ---- interaction: drag to rotate (horizontal only), pause
    auto-spin, resume on release ---- */ const AUTO=0.02; // idle spin speed (rad/frame) let dragging=false, lastX=0, vel=AUTO, idleTimer=0; const el=renderer.domElement; el.style.touchAction='pan-y'; // let vertical page scroll pass through on touch
    el.style.cursor='grab'; function down(x){ dragging=true; lastX=x; vel=0; idleTimer=0; el.style.cursor='grabbing'; } function move(x){ if(!dragging) return; const dx=x-lastX; lastX=x; const d=dx*0.01; group.rotation.y+=d; vel=d; } // horizontal drag
    → Y rotation only function up(){ if(!dragging) return; dragging=false; el.style.cursor='grab'; idleTimer=0; } el.addEventListener('pointerdown',e=>{ el.setPointerCapture(e.pointerId); down(e.clientX); }); el.addEventListener('pointermove',e=>move(e.clientX));
    el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up); el.addEventListener('pointerleave',up); renderer.setAnimationLoop(()=>{ if(dragging){ /* rotation handled by drag */ } else { // after release: let the flick momentum decay,
    then ease back to steady auto-spin if(Math.abs(vel)>AUTO){ group.rotation.y+=vel; vel*=0.94; } else { idleTimer=Math.min(idleTimer+0.02,1); vel=AUTO; group.rotation.y+=vel*idleTimer; } } renderer.render(scene,camera); });
</script>
