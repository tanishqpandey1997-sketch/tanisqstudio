<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Logo mark</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
    }
    #app {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }
    canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
    }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
    let THREE = window.THREE;
    if (!THREE) {
        try {
            THREE = await import('/cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
        } catch (e) {
            try {
                THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
            } catch (e2) {}
        }
    }
    if (!THREE) {
        THREE = window.THREE;
    }

    function createRoomEnvironment() {
        const envScene = new THREE.Scene();
        const geo = new THREE.BoxGeometry();
        const roomMat = new THREE.MeshStandardMaterial({ side: THREE.BackSide });
        const boxMat = new THREE.MeshStandardMaterial();
        const pLight = new THREE.PointLight(0xffffff, 900, 28, 2);
        pLight.position.set(0.418, 16.199, 0.300);
        envScene.add(pLight);
        const room = new THREE.Mesh(geo, roomMat);
        room.position.set(-0.757, 13.219, 0.717);
        room.scale.set(31.713, 28.305, 28.591);
        envScene.add(room);
        const b1 = new THREE.Mesh(geo, boxMat);
        b1.position.set(-10.906, 2.009, 1.846);
        b1.scale.set(2.328, 7.905, 4.651);
        envScene.add(b1);
        const b2 = new THREE.Mesh(geo, boxMat);
        b2.position.set(6.167, 0.857, 7.803);
        b2.scale.set(3.927, 6.285, 3.687);
        envScene.add(b2);
        return envScene;
    }

    const outerPts = [
        [39.38, 88.64], [45.83, 88.17], [395.32, 88.18], [406.8, 89.25], [415.41, 91.23],
        [425.46, 94.97], [433.35, 98.87], [439.81, 103.01], [448.42, 109.89], [455.35, 116.88],
        [461.72, 124.77], [466.75, 132.67], [470.74, 140.56], [474.69, 150.61], [477.37, 160.66],
        [478.94, 169.27], [479.91, 180.75], [478.34, 199.41], [473.42, 220.94], [470.09, 229.55],
        [463.68, 241.75], [457.14, 251.08], [448.38, 261.01], [439.1, 268.81], [430.48, 274.72],
        [417.57, 281.29], [406.8, 285.26], [392.45, 288.52], [380.25, 289.79], [317.82, 289.84],
        [305.62, 290.55], [284.8, 289.84], [256.1, 290.63], [251.12, 291.85], [247.98, 294.32],
        [245.61, 297.72], [191.18, 396.76], [187.99, 401.78], [184.29, 405.91], [179.31, 409.23],
        [172.14, 410.98], [148.46, 411.82], [119.75, 411.8], [115.45, 411.24], [112.08, 409.31],
        [109.47, 405.36], [108.88, 401.06], [110.33, 396.04], [157.58, 307.05], [221.68, 183.62],
        [230.02, 167.11], [230.74, 162.95], [228.68, 160.62], [224.52, 159.95], [91.05, 159.94],
        [81.72, 160.51], [64.49, 160], [39.38, 160.65], [29.33, 159.26], [25.79, 157.32],
        [23.3, 154.86], [21.24, 151.33], [20.37, 147.74], [24.92, 108.99], [26.48, 100.37],
        [28.8, 95.39], [32.96, 91.26], [39.38, 88.64]
    ];

    const holePts = [
        [395.32, 217.23], [400.7, 211.61], [404.79, 205.15], [407.16, 197.97], [408.21, 190.8],
        [407.05, 182.18], [405.14, 176.44], [401.55, 170.7], [396.04, 165.18], [388.86, 161.18],
        [378.81, 159.33], [326.43, 159.24], [320.75, 160.28], [318.04, 162.84], [288.74, 218.78],
        [287.53, 222.29], [288.62, 224.24], [293.42, 225.22], [371.64, 225.22], [384.56, 223.04],
        [391.01, 220.3], [395.32, 217.23]
    ];

    const shape = new THREE.Shape();
    shape.moveTo(outerPts[0][0], outerPts[0][1]);
    for (let i = 1; i < outerPts.length; i++) {
        shape.lineTo(outerPts[i][0], outerPts[i][1]);
    }

    const hole = new THREE.Path();
    hole.moveTo(holePts[0][0], holePts[0][1]);
    for (let i = 1; i < holePts.length; i++) {
        hole.lineTo(holePts[i][0], holePts[i][1]);
    }
    shape.holes.push(hole);

    const app = document.getElementById('app');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, premultipliedAlpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    const initW = app.clientWidth || window.innerWidth || 400;
    const initH = app.clientHeight || window.innerHeight || 400;
    renderer.setSize(initW, initH);
    renderer.setClearColor(0x000000, 0);
    renderer.shadowMap.enabled = false;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(createRoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(33, initW / initH, 1, 4000);
    camera.position.set(0, 0, 1150);

    const key = new THREE.DirectionalLight(0xffffff, 2.5);
    key.position.set(-160, 220, 340);
    scene.add(key);

    const rim = new THREE.DirectionalLight(0xffffff, 2.0);
    rim.position.set(260, -120, -160);
    scene.add(rim);

    const fill = new THREE.DirectionalLight(0xffffff, 1.2);
    fill.position.set(120, 60, 260);
    scene.add(fill);

    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    const group = new THREE.Group();
    group.scale.y = -1;
    scene.add(group);

    const depth = 42, bevel = Math.min(9, depth * 0.28);
    const geo = new THREE.ExtrudeGeometry(shape, {
        depth,
        bevelEnabled: true,
        bevelThickness: bevel,
        bevelSize: bevel,
        bevelSegments: 5,
        curveSegments: 64
    });

    const CX = 250, CY = 250;
    geo.translate(-CX, -CY, -depth / 2);
    geo.computeVertexNormals();

    const mat = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color('#222222'),
        metalness: 0.2,
        roughness: 0.35,
        clearcoat: 0.85,
        clearcoatRoughness: 0.15,
        envMapIntensity: 0.8,
        side: THREE.DoubleSide
    });

    group.add(new THREE.Mesh(geo, mat));

    function onResize() {
        const w = app.clientWidth || window.innerWidth || 400;
        const h = app.clientHeight || window.innerHeight || 400;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    }
    window.addEventListener('resize', onResize);
    setTimeout(onResize, 50);

    /* ---- interaction: drag to rotate, auto-spin ---- */
    const AUTO = 0.02;
    let dragging = false, lastX = 0, vel = AUTO, idleTimer = 0;
    const el = renderer.domElement;
    el.style.touchAction = 'pan-y';
    el.style.cursor = 'grab';

    function down(x) {
        dragging = true;
        lastX = x;
        vel = 0;
        idleTimer = 0;
        el.style.cursor = 'grabbing';
    }

    function move(x) {
        if (!dragging) return;
        const dx = x - lastX;
        lastX = x;
        const d = dx * 0.01;
        group.rotation.y += d;
        vel = d;
    }

    function up() {
        if (!dragging) return;
        dragging = false;
        el.style.cursor = 'grab';
        idleTimer = 0;
    }

    el.addEventListener('pointerdown', e => {
        el.setPointerCapture(e.pointerId);
        down(e.clientX);
    });
    el.addEventListener('pointermove', e => move(e.clientX));
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', up);

    let isVisible = true;
    if (typeof IntersectionObserver !== 'undefined') {
        const observer = new IntersectionObserver((entries) => {
            isVisible = entries[0].isIntersecting;
        }, { threshold: 0.01 });
        observer.observe(document.documentElement);
    }

    document.addEventListener('visibilitychange', () => {
        isVisible = !document.hidden;
    });

    renderer.setAnimationLoop(() => {
        if (!isVisible) return;
        if (!dragging) {
            if (Math.abs(vel) > AUTO) {
                group.rotation.y += vel;
                vel *= 0.94;
            } else {
                idleTimer = Math.min(idleTimer + 0.02, 1);
                vel = AUTO;
                group.rotation.y += vel * idleTimer;
            }
        }
        renderer.render(scene, camera);
    });
</script>
</body>
</html>
